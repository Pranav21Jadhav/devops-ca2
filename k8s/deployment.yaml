apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo-app
  namespace: devops-demo
  labels:
    app: devops-demo-app
    version: "1.0.0"
    managed-by: github-actions
spec:
  replicas: 3                          # 3 pods for high availability
  selector:
    matchLabels:
      app: devops-demo-app

  # ── Rolling Update Strategy ──────────────────────────────────────
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Allow 1 extra pod during update
      maxUnavailable: 0    # Zero downtime — no pod removed until new one is Ready

  template:
    metadata:
      labels:
        app: devops-demo-app
    spec:
      containers:
        - name: devops-demo-app
          image: <DOCKERHUB_USERNAME>/devops-demo-app:latest
          ports:
            - containerPort: 3000

          # ── Environment Variables ──────────────────────────────
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['version']

          # ── Resource Limits ────────────────────────────────────
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"

          # ── Liveness Probe (restart if unresponsive) ───────────
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          # ── Readiness Probe (receive traffic only when ready) ──
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1

      # ── Pod Topology Spread (distribute across nodes) ─────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: devops-demo-app
