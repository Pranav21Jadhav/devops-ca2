apiVersion: v1
kind: Service
metadata:
  name: devops-demo-service
  namespace: devops-demo
  labels:
    app: devops-demo-app
spec:
  type: LoadBalancer           # Exposes app externally (use NodePort for local cluster)
  selector:
    app: devops-demo-app       # Routes traffic to pods with this label
  ports:
    - name: http
      protocol: TCP
      port: 80                 # External port
      targetPort: 3000         # Container port
  sessionAffinity: None

---
# ── Namespace definition ─────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: devops-demo
  labels:
    environment: production

---
# ── Horizontal Pod Autoscaler ────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-demo-hpa
  namespace: devops-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-demo-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
